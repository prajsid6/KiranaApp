<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Shop owner login — Kirana Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kirana <span class="brand-accent">Store</span></span></a>
      <div class="nav-actions">
        <a class="owner-login-btn" href="index.html">Back to directory</a>
      </div>
    </div>
  </header>

  <main class="container owner-dashboard">
    <section class="owner-intro">
      <p class="kicker">SHOP MANAGEMENT</p>
      <h1>Shop owner login</h1>
      <p>Sign in with the phone number submitted for your approved shop to update its details and available items.</p>
    </section>

    <section class="owner-login-panel" id="ownerLoginPanel">
      <form id="ownerPhoneForm">
        <label for="ownerPhone">Shop owner phone number (+country code)</label>
        <input id="ownerPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+919876543210" pattern="[+][1-9][0-9]{7,14}" required>
        <div id="owner-recaptcha"></div>
        <button class="primary-btn reviewer-submit" id="sendOwnerOtp" type="submit">Send verification code</button>
      </form>
      <form id="ownerOtpForm" class="hidden">
        <label for="ownerOtp">6-digit verification code</label>
        <input id="ownerOtp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <button class="primary-btn reviewer-submit" id="verifyOwnerOtp" type="submit">Verify and sign in</button>
      </form>
      <button class="owner-back-btn hidden" id="useAnotherPhone" type="button">Use another number</button>
    </section>

    <section class="reviewer-dashboard hidden" id="ownerDashboard">
      <div class="reviewer-heading">
        <div>
          <h2>Your shops</h2>
          <p id="ownerIdentity"></p>
        </div>
        <button class="owner-back-btn" id="ownerSignOut" type="button">Sign out</button>
      </div>
      <div id="ownedShops" class="owned-shops"></div>
    </section>

    <p id="ownerStatus" class="reviewer-status" role="status" aria-live="polite"></p>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module" src="owner.js"></script>
</body>
</html>
